# 급등 신호 폰 알림 스캐너 (GitHub Actions · PC 꺼져 있어도 동작)
# 저장소: ogeunho011-dotcom/short-dashboard
# - cron 은 UTC 기준. 미국 서머타임(EDT, UTC-4)·표준시(EST, UTC-5) 둘 다 덮도록 넓게 잡고,
#   첫 단계(gate)에서 뉴욕 현지 시각으로 프리마켓 04:00 ~ 애프터 20:00 (월~금) 인지 확인해 아니면 바로 끝냅니다.
# - GitHub 의 예약 실행은 몇 분~수십 분 늦거나 가끔 건너뛸 수 있습니다 (무료 러너 공통 한계).
# - 간격: 정규장 20분, 프리/애프터 60분. 프리마켓~정규장의 빠른 스캔(약 2.5분)은 alerts-loop.yml 이 맡고,
#   그 작업이 돌고 있으면 이 작업은 건너뜀(백업). 애프터마켓은 이 작업이 계속 담당.
name: alerts

on:
  schedule:
    - cron: "5,25,45 13-20 * * 1-5"     # 정규장 근처 (UTC 13~20시) 20분 간격
    - cron: "15 8-12,21-23 * * 1-5"     # 프리마켓 / 애프터마켓 1시간 간격
    - cron: "15 0 * * 2-6"              # 표준시(EST) 애프터마켓 마지막 1시간 (UTC 다음날 00시)
  workflow_dispatch:
    inputs:
      force:
        description: "장 시간 아니어도 실행 (테스트)"
        type: boolean
        default: false
      test:
        description: "테스트 알림만 보내기"
        type: boolean
        default: false

permissions:
  contents: write        # alert-data 브랜치에 알림 기록 커밋
  actions: read          # 장중 반복 작업(alerts-loop)이 돌고 있는지 확인

concurrency:
  group: alerts
  cancel-in-progress: false

env:
  ALERT_BRANCH: alert-data
  DB_TAG: db-latest
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: gate (뉴욕 현지 시각 확인 · 서머타임 자동)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          r=$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo("America/New_York"))
          m = n.hour * 60 + n.minute
          ok = n.weekday() < 5 and 4 * 60 <= m < 20 * 60
          print("true" if ok else "false")
          PY
          )
          echo "뉴욕 시각: $(TZ=America/New_York date)"
          if [ "$r" = "true" ]; then
            busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow alerts-loop.yml --status in_progress --limit 5 --json databaseId --jq length 2>/dev/null || echo 0)
            if [ "${busy:-0}" != "0" ]; then echo "장중 반복 작업이 실행 중 → 백업 스캔 건너뜀"; r=false; fi
          fi
          echo "run=$r" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true' || inputs.force || inputs.test

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true' || inputs.force || inputs.test
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-alerts.txt

      - name: 패키지 설치 (알림용 최소 패키지 — 설치 시간 단축)
        if: steps.gate.outputs.run == 'true' || inputs.force || inputs.test
        run: pip install -r requirements-alerts.txt

      - name: 최신 DB 받기 (daily 작업이 만든 릴리스 자산)
        if: steps.gate.outputs.run == 'true' || inputs.force || inputs.test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download "$DB_TAG" -p shortdash.sqlite.gz -D /tmp --clobber; then
            gunzip -c /tmp/shortdash.sqlite.gz > data/shortdash.sqlite
            ls -la data/shortdash.sqlite
          else
            echo "::warning::DB 스냅샷이 아직 없습니다. Actions 탭에서 'daily' 작업을 먼저 한 번 실행하세요."
          fi

      - name: 알림 기록 브랜치 가져오기
        if: steps.gate.outputs.run == 'true' || inputs.force || inputs.test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$ALERT_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$ALERT_BRANCH" "$url" alertdata
          else
            mkdir alertdata && git -C alertdata init -b "$ALERT_BRANCH" && git -C alertdata remote add origin "$url"
          fi
          mkdir -p alertdata/data/alerts alertdata/data/borrow

      - name: 스캔 + 알림 + 호재 공시 + 채점
        if: steps.gate.outputs.run == 'true' || inputs.force || inputs.test
        env:
          SHORTDASH_ALERT_DIR: ${{ github.workspace }}/alertdata/data/alerts
          SHORTDASH_BORROW_DIR: ${{ github.workspace }}/alertdata/data/borrow
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASH_URL: ${{ secrets.DASH_URL }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python scripts/alerts_run.py --test
          elif [ "${{ inputs.force }}" = "true" ]; then
            python scripts/alerts_run.py --force
          else
            python scripts/alerts_run.py
          fi

      - name: 알림 기록 저장 (alert-data 브랜치)
        if: always() && (steps.gate.outputs.run == 'true' || inputs.force || inputs.test)
        run: |
          cd alertdata
          git config user.name "shortradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/alerts data/borrow
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "alerts $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin "HEAD:$ALERT_BRANCH"
