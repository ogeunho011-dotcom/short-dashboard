# 장중 빠른 급등 스캐너 (GitHub Actions 한 작업이 프리마켓~정규장 동안 약 2.5분마다 반복)
# - 예약(cron)은 UTC 기준 10분마다(정각 피해서) 시작 시도 → 첫 단계에서 뉴욕 현지 시각(서머타임 자동, 2026-11-01 표준시 전환 포함)으로
#   월~금 04:00~15:50 인지 확인. 이미 반복 중인 작업이 있으면 바로 끝냄 (중복 방지).
# - GitHub 작업 한도 6시간 → 약 5.5시간(LOOP_MAX_MIN) 뒤 스스로 다음 작업을 띄우고(handoff) 끝냄. 다음 작업은 앞 작업이 끝날 때까지 기다림.
# - 반복이 죽어도 10분 뒤 다음 cron 이 다시 시작. 기존 alerts.yml(20분 간격)은 백업 — 반복 작업이 돌고 있으면 건너뜀.
# - 공개 저장소의 GitHub 호스티드 러너 사용 시간은 무료(무제한).
name: alerts-loop

on:
  schedule:
    - cron: "4,14,24,34,44,54 8-20 * * 1-5"   # UTC 08~20시, 10분마다 시도 (정각·30분은 GitHub 예약이 몰려 지연/누락 잦음 → 비켜감). 이미 돌고 있으면 gate 가 10초 안에 끝냄
  workflow_dispatch:
    inputs:
      handoff:
        description: "앞 작업에서 넘겨받음 (자동)"
        type: boolean
        default: false
      force:
        description: "장 시간 아니어도 1회만 실행 (테스트)"
        type: boolean
        default: false

permissions:
  contents: write        # alert-data 브랜치에 기록
  actions: write         # 다음 작업 띄우기 + 진행 중 작업 확인

env:
  ALERT_BRANCH: alert-data
  DB_TAG: db-latest
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: gate (뉴욕 시각 + 중복 확인)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF: ${{ inputs.handoff }}
          FORCE: ${{ inputs.force }}
        run: |
          ok=$(python3 -c "
          from datetime import datetime; from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo('America/New_York')); m = n.hour*60 + n.minute
          print('true' if n.weekday() < 5 and 240 <= m < 950 else 'false')")
          echo "뉴욕 시각: $(TZ=America/New_York date) · 장 시간: $ok"
          if [ "$FORCE" = "true" ]; then echo "run=once" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ok" != "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          older() { gh run list -R "$GITHUB_REPOSITORY" --workflow alerts-loop.yml --limit 30 --json databaseId,status \
                    --jq "[.[] | select((.status==\"in_progress\" or .status==\"queued\") and .databaseId < $GITHUB_RUN_ID)] | length"; }
          n=$(older || echo 0)
          if [ "$HANDOFF" = "true" ]; then
            for i in $(seq 1 60); do [ "$n" = "0" ] && break; sleep 15; n=$(older || echo 0); done   # 앞 작업 마무리 대기 (최대 15분)
          fi
          if [ "$n" != "0" ]; then echo "이미 반복 중인 작업 있음 → 종료"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run != 'false'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run != 'false'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-alerts.txt

      - name: 패키지 설치
        if: steps.gate.outputs.run != 'false'
        run: pip install -r requirements-alerts.txt

      - name: 최신 DB 받기
        if: steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download "$DB_TAG" -p shortdash.sqlite.gz -D /tmp --clobber; then
            gunzip -c /tmp/shortdash.sqlite.gz > data/shortdash.sqlite; ls -la data/shortdash.sqlite
          else
            echo "::warning::DB 스냅샷이 없습니다. 'daily' 작업을 먼저 실행하세요."
          fi

      - name: 알림 기록 브랜치 가져오기
        if: steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$ALERT_BRANCH" >/dev/null; then
            git clone --depth 20 --branch "$ALERT_BRANCH" "$url" alertdata
          else
            mkdir alertdata && git -C alertdata init -b "$ALERT_BRANCH" && git -C alertdata remote add origin "$url"
          fi
          mkdir -p alertdata/data/alerts alertdata/data/borrow

      - name: 장중 반복 스캔 (약 2.5분 간격)
        id: loop
        if: steps.gate.outputs.run != 'false'
        env:
          SHORTDASH_ALERT_DIR: ${{ github.workspace }}/alertdata/data/alerts
          SHORTDASH_BORROW_DIR: ${{ github.workspace }}/alertdata/data/borrow
          ALERT_SYNC_CMD: bash ${{ github.workspace }}/scripts/alert_sync.sh
          ALERT_REPO_DIR: ${{ github.workspace }}/alertdata
          LOOP_INTERVAL_S: "150"
          LOOP_MAX_MIN: "330"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASH_URL: ${{ secrets.DASH_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ steps.gate.outputs.run }}" = "once" ]; then
            python scripts/alerts_run.py --force && echo "result=once" >> "$GITHUB_OUTPUT"
          else
            python scripts/alerts_run.py --session-loop
          fi

      - name: 다음 작업 띄우기 (6시간 한도 넘기 전)
        if: steps.loop.outputs.result == 'handoff'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alerts-loop.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f handoff=true

      - name: 알림 기록 저장
        if: always() && steps.gate.outputs.run != 'false'
        env:
          ALERT_REPO_DIR: ${{ github.workspace }}/alertdata
        run: bash scripts/alert_sync.sh push
