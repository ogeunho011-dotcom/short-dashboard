# 일회성 연결 점검 (차입 데이터 소스가 GitHub 서버에서 열리는지 확인)
name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: IBKR FTP2
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import ftplib, io, time
          for host in ("ftp2.interactivebrokers.com", "ftp3.interactivebrokers.com"):
              t=time.time()
              try:
                  f=ftplib.FTP(host, timeout=20); f.login("shortstock","")
                  print(host, f.nlst()[:30])
                  b=io.BytesIO(); f.retrbinary("RETR usa.txt", b.write); f.quit()
                  lines=b.getvalue().decode("latin1").splitlines()
                  print(host, len(lines), "lines", round(time.time()-t,1), "s")
                  print("\n".join(lines[:3]))
                  print("\n".join(l for l in lines if l.startswith(("SOUN|","OCGN|","GME|"))))
              except Exception as e:
                  print(host, "FAIL", repr(e), round(time.time()-t,1))
          PY
